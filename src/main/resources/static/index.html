<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperMart</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🛒 SuperMart Automation</h1><p>Java OOP · Spring Boot · MySQL</p></header><main><section class="stats"><article><small>Products</small><h2 id="count">—</h2></article><article><small>Low stock</small><h2 id="low">—</h2></article><article><small>Today's bills</small><h2 id="bills">—</h2></article><article><small>Today's sales</small><h2 id="total">—</h2></article></section><section><h2>Product inventory</h2><form id="add"><input id="code" placeholder="Code" required><input id="name" placeholder="Product name" required><input id="category" placeholder="Category"><input id="price" type="number" step=".01" min=".01" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><button>Add product</button></form><input id="search" placeholder="Search products..." oninput="loadProducts()"><table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section><section><h2>Point of sale</h2><div class="checkout"><select id="product"></select><input id="qty" type="number" min="1" value="1"><select id="method"><option>CASH</option><option>UPI</option><option>CARD</option></select><button onclick="checkout()">Complete sale</button></div><p id="message"></p></section><section><h2>Recent sales</h2><table><thead><tr><th>Bill</th><th>Date</th><th>Payment</th><th>Total</th></tr></thead><tbody id="sales"></tbody></table></section></main><script src="app.js"></script></body></html>
